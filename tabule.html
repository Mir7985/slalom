<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slalom - Živé Výsledky</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Inter:wght@400;600;700&display=swap');
        
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        .table-container {
            width: 100%;
            height: calc(100vh - 140px);
            overflow-y: auto;
            font-family: 'Roboto Mono', monospace;
        }

        table { width: 100%; border-collapse: collapse; }

        thead {
            position: sticky;
            top: 0;
            background-color: #1e293b;
            z-index: 10;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        th {
            text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.05em;
            color: #94a3b8; padding: 16px; text-align: left; white-space: nowrap;
        }

        td {
            padding: 16px; border-bottom: 1px solid #334155; font-size: 1.15rem; 
        }

        tbody tr:nth-child(even) { background-color: #1e293b; }
        tbody tr:hover { background-color: #334155; }

        .rank-col { color: #facc15; font-weight: bold; font-size: 1.4rem; text-align: center; }
        .wait-text { color: #f59e0b; font-size: 1rem; }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="bg-black/80 p-4 flex flex-col md:flex-row justify-between items-center gap-4 border-b border-slate-800">
        <h1 class="text-2xl md:text-3xl font-bold tracking-widest text-white uppercase">Slalom Výsledky</h1>
        
        <div class="flex flex-wrap justify-center items-center gap-4">
            <button id="autoplay-btn" onclick="toggleAutoPlay()" class="flex items-center gap-2 bg-emerald-600/20 text-emerald-400 border border-emerald-600 px-3 py-1.5 rounded-full text-sm font-bold transition-colors">
                <span id="autoplay-icon">▶</span>
                <span id="autoplay-text">AUTO-TV: ZAPNUTO</span>
            </button>

            <span id="last-update" class="text-gray-400 text-sm hidden md:inline">Načítám...</span>
            
            <div class="flex items-center gap-2 bg-slate-800 px-4 py-2 rounded-full border border-slate-700">
                <div class="w-3 h-3 rounded-full bg-red-500 animate-pulse" id="status-dot"></div>
                <span class="text-sm font-bold tracking-wider" id="status-text">LIVE</span>
            </div>
        </div>
    </header>

    <div class="bg-slate-900 border-b border-slate-800 w-full">
        <div id="category-tabs" class="flex overflow-x-auto scrollbar-hide py-3 px-4 gap-2 items-center min-w-full">
            <span class="text-slate-500 text-sm italic">Hledám kategorie v datech...</span>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead id="table-head">
            </thead>
            <tbody id="table-body">
                <tr><td class="text-center py-20 text-xl text-gray-500">Čekám na spojení a první data...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // === ZDE VLOŽTE SVOJI NOVOU GOOGLE SCRIPT URL ===
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwA_LHsjORNhd9mueGP_H_mp5RHHGK1EMpbs00xy-i3UkfIW_SwABAbUHNxAx3J3g3s/exec'; 

        const FETCH_INTERVAL = 10000; 
        const AUTOPLAY_INTERVAL = 10000; 
        
        let allData = [];
        let headers = [];
        let categories = [];
        let currentCategory = 'Vše';
        let categoryColumnIndex = -1;
        
        let isAutoPlay = true;
        let autoPlayTimer = null;

        async function fetchResults() {
            // Kontrola, zda uživatel vložil platnou URL
            if (!GOOGLE_SCRIPT_URL || !GOOGLE_SCRIPT_URL.startsWith('http')) {
                document.getElementById('table-body').innerHTML = `<tr><td colspan="100%" class="text-center py-20 text-red-500 font-bold text-xl">CHYBA: Zadejte prosím URL adresu vašeho Google Apps Scriptu do kódu!</td></tr>`;
                document.getElementById('status-dot').className = 'w-3 h-3 rounded-full bg-red-500';
                document.getElementById('last-update').textContent = 'Chybí URL adresa';
                document.getElementById('last-update').classList.remove('hidden');
                return;
            }

            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=getResults`);
                const data = await response.json();
                
                if (data.error) throw new Error(data.error);
                if (!data || data.length === 0) return;

                headers = data[0];
                allData = data.slice(1).filter(row => row[0] && row[0] !== ''); 

                categoryColumnIndex = headers.findIndex(h => {
                    const hLow = h.toLowerCase().trim();
                    return hLow === 'kategorie' || hLow === 'kat.' || hLow === 'kat' || hLow === 'category';
                });

                if (categoryColumnIndex !== -1) {
                    const rawCategories = allData.map(row => row[categoryColumnIndex]).filter(c => c && c.trim() !== '');
                    const uniqueCats = [...new Set(rawCategories)];
                    
                    if (JSON.stringify(categories) !== JSON.stringify(uniqueCats)) {
                        categories = uniqueCats;
                        renderCategoryTabs();
                        
                        if (!categories.includes(currentCategory) && categories.length > 0) {
                            currentCategory = categories[0];
                        }
                    }
                }

                renderTable();
                
                const now = new Date();
                document.getElementById('last-update').textContent = `Akt. ${now.toLocaleTimeString('cs-CZ')}`;
                const dot = document.getElementById('status-dot');
                dot.classList.replace('bg-red-500', 'bg-green-500');
                dot.classList.replace('bg-yellow-500', 'bg-green-500'); // Pokud to bylo žluté kvůli minulé chybě
                setTimeout(() => dot.classList.replace('bg-green-500', 'bg-red-500'), 1000);

            } catch (error) {
                console.error("Chyba:", error);
                document.getElementById('status-dot').className = 'w-3 h-3 rounded-full bg-yellow-500';
            }
        }

        function renderCategoryTabs() {
            const container = document.getElementById('category-tabs');
            let html = '';
            
            categories.forEach(cat => {
                const isActive = cat === currentCategory;
                const activeClasses = isActive ? 'bg-blue-600 text-white shadow-md shadow-blue-900/50 scale-105' : 'bg-slate-800 text-slate-300 hover:bg-slate-700';
                html += `<button onclick="selectCategory('${cat}')" class="px-5 py-2 rounded-full whitespace-nowrap font-bold text-sm transition-all duration-300 ${activeClasses}">${cat}</button>`;
            });
            
            container.innerHTML = html;
        }

        function selectCategory(cat) {
            currentCategory = cat;
            renderCategoryTabs();
            renderTable();
            
            const activeBtn = document.querySelector('#category-tabs button.bg-blue-600');
            if (activeBtn) {
                activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }

        function toggleAutoPlay() {
            isAutoPlay = !isAutoPlay;
            const btn = document.getElementById('autoplay-btn');
            const text = document.getElementById('autoplay-text');
            const icon = document.getElementById('autoplay-icon');
            
            if (isAutoPlay) {
                btn.className = 'flex items-center gap-2 bg-emerald-600/20 text-emerald-400 border border-emerald-600 px-3 py-1.5 rounded-full text-sm font-bold transition-colors';
                text.textContent = 'AUTO-TV: ZAPNUTO';
                icon.textContent = '▶';
                startAutoPlayTimer();
            } else {
                btn.className = 'flex items-center gap-2 bg-slate-700 text-slate-400 border border-slate-600 px-3 py-1.5 rounded-full text-sm font-bold transition-colors hover:text-white';
                text.textContent = 'AUTO-TV: VYPNUTO';
                icon.textContent = '⏸';
                clearInterval(autoPlayTimer);
            }
        }

        function startAutoPlayTimer() {
            clearInterval(autoPlayTimer);
            autoPlayTimer = setInterval(() => {
                if (categories.length > 1) {
                    let currentIndex = categories.indexOf(currentCategory);
                    let nextIndex = (currentIndex + 1) % categories.length;
                    selectCategory(categories[nextIndex]);
                }
            }, AUTOPLAY_INTERVAL);
        }

        function renderTable() {
            const thead = document.getElementById('table-head');
            const tbody = document.getElementById('table-body');
            
            let dataToShow = [...allData]; 
            if (categoryColumnIndex !== -1 && currentCategory !== 'Vše' && categories.length > 0) {
                dataToShow = allData.filter(row => row[categoryColumnIndex] === currentCategory);
            }

            // --- NOVINKA: Zjištění, zda se jelo 2. kolo ---
            let cas2Index = headers.findIndex(h => {
                let l = h.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                return l.includes('cas 2') || l.includes('2. cas') || l.includes('2.cas');
            });

            let hasRound2 = true; 
            if (cas2Index !== -1 && dataToShow.length > 0) {
                hasRound2 = dataToShow.some(row => {
                    let val = row[cas2Index];
                    if (val === undefined || val === null) return false;
                    val = val.toString().trim();
                    return val !== '' && val !== '-';
                });
            }

            // 1. Zjistíme, které sloupce skrýt
            const visibleColumns = headers.map((_, colIndex) => {
                const headerText = headers[colIndex].toLowerCase();
                const headerNormalized = headerText.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                
                if (headerNormalized.includes('poradi')) return false; 
                
                if (!hasRound2) {
                    if (headerNormalized.includes('cas 2') || headerNormalized.includes('pen 2') || headerNormalized.includes('trest 2') || headerNormalized.includes('2.kolo') || headerNormalized.includes('2kolo') || headerNormalized.includes('2. kolo')) {
                        return false;
                    }
                }

                if (dataToShow.length === 0) return true;

                return dataToShow.some(row => {
                    let val = row[colIndex];
                    if (val === undefined || val === null) return false;
                    val = val.toString().trim();
                    return val !== '' && val !== '-';
                });
            });

            // --- Zjištění indexu úplně posledního zobrazeného sloupce ---
            let lastVisibleIndex = -1;
            for (let i = headers.length - 1; i >= 0; i--) {
                if (visibleColumns[i]) {
                    lastVisibleIndex = i;
                    break;
                }
            }

            // 2. Hledáme sloupec s konečným výsledkem pro třídění
            let sortIndex = headers.findIndex(h => {
                let l = h.toLowerCase().trim();
                return l === 'výsledek' || l === 'vysledek' || l === 'celkem' || l === 'konečný výsledek';
            });
            
            if (sortIndex === -1) {
                sortIndex = headers.findIndex(h => {
                    let l = h.toLowerCase().trim();
                    return (l.includes('výsledek') || l.includes('vysledek') || l.includes('celkem')) && !l.includes('1') && !l.includes('2');
                });
            }

            // 3. Třídění (nejrychlejší čas / nejméně bodů je první)
            if (sortIndex !== -1) {
                dataToShow.sort((a, b) => {
                    let parse = (v) => {
                        if (!v || v.toString().trim() === '') return Infinity; 
                        let str = v.toString().toLowerCase();
                        if (str.includes('čeká') || str.includes('dnf') || str.includes('dns') || str.includes('dsq')) return Infinity; 
                        
                        if (str.includes(':')) {
                            let parts = str.split(':');
                            if (parts.length === 2) {
                                let m = parseFloat(parts[0]) || 0;
                                let s = parseFloat(parts[1].replace(',', '.')) || 0;
                                return m * 60 + s;
                            }
                        }
                        let num = parseFloat(str.replace(',', '.'));
                        return isNaN(num) ? str : num; 
                    };

                    let pA = parse(a[sortIndex]);
                    let pB = parse(b[sortIndex]);

                    if (pA === pB) return 0;
                    if (pA === Infinity) return 1;
                    if (pB === Infinity) return -1;
                    return pA > pB ? 1 : -1;
                });
            }

            // 4. Hlavička
            let theadHTML = '<tr><th class="w-16 text-center text-yellow-500 font-bold">POŘ.</th>';
            headers.forEach((header, index) => {
                if (!visibleColumns[index]) return; 
                theadHTML += `<th>${header}</th>`;
            });
            theadHTML += '</tr>';
            thead.innerHTML = theadHTML;

            // 5. Tělo tabulky
            let tbodyHTML = '';
            let validRank = 1; 
            
            dataToShow.forEach((row, rowIndex) => {
                tbodyHTML += '<tr>';
                
                let hasValidResult = true;
                if (sortIndex !== -1) {
                    let val = row[sortIndex];
                    if (!val || val.toString().trim() === '') {
                        hasValidResult = false;
                    } else {
                        let str = val.toString().toLowerCase();
                        if (str.includes('čeká') || str.includes('dnf') || str.includes('dns') || str.includes('dsq')) {
                            hasValidResult = false;
                        }
                    }
                }

                if (hasValidResult) {
                    tbodyHTML += `<td class="rank-col">${validRank}.</td>`;
                    validRank++;
                } else {
                    tbodyHTML += `<td class="rank-col" style="color: #475569;">-</td>`;
                }
                
                row.forEach((cell, index) => {
                    if (!visibleColumns[index]) return; 

                    const headerText = headers[index].toLowerCase();
                    const headerNormalized = headerText.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                    let classNames = 'whitespace-nowrap '; 
                    let displayCell = cell !== '' ? cell : '-';

                    // --- BAREVNÉ ZALOMENÍ SLOUPCE S PENALIZACEMI ---
                    // Nyní se aktivuje vždy, když se sloupec jmenuje "penalizace" NEBO je to úplně poslední sloupec
                    if (headerNormalized.includes('penalizace') || index === lastVisibleIndex) {
                        classNames = 'text-[0.95rem] leading-relaxed min-w-[450px] xl:min-w-[500px] whitespace-normal ';
                        
                        if (typeof displayCell === 'string' && displayCell !== '-') {
                            
                            // 1. Zvýraznění konkrétních chyb (50 a 5 po šipce ➔ nebo -> )
                            // Nahrazuje text jako "➔ 50" nebo "-> 5" a uchová před i za ním případné mezery nebo oddělovače |
                            displayCell = displayCell
                                .replace(/([➔>-]\s*)(50)(\s*\||\s*$)/g, '$1<strong class="text-red-400 font-black drop-shadow-sm text-base">50</strong>$3')
                                .replace(/([➔>-]\s*)(5)(\s*\||\s*$)/g, '$1<strong class="text-amber-400 font-black drop-shadow-sm text-base">5</strong>$3');

                            // 2. Oddělení kol (pokud tabulka sama pošle nový řádek nebo znak \n)
                            // Oddělíme řádky, případně zkusíme najít text "1. kolo" a "2. kolo"
                            let lines = displayCell.split('\n');
                            
                            // Pokud je v textu jen jeden řádek a je tam manuálně napsáno 1. a 2. kolo, rozdělíme to
                            if (lines.length === 1 && /(1\.\s*kolo|1\.kolo|1\s*kolo)/i.test(displayCell) && /(2\.\s*kolo|2\.kolo|2\s*kolo)/i.test(displayCell)) {
                                displayCell = displayCell
                                    .replace(/(1\.\s*kolo|1\.kolo|1\s*kolo)[:\s-]*(.*?)(?=(2\.\s*kolo|2\.kolo|2\s*kolo|$))/gi, '<div class="text-blue-100 mb-2 flex items-start"><span class="bg-blue-900/80 text-blue-200 px-2.5 py-0.5 rounded-md text-xs font-bold uppercase tracking-wider mr-3 shadow-sm border border-blue-700/50 mt-0.5 whitespace-nowrap">1. kolo</span> <span class="opacity-90 whitespace-normal leading-relaxed">$2</span></div>')
                                    .replace(/(2\.\s*kolo|2\.kolo|2\s*kolo)[:\s-]*(.*)/gi, '<div class="text-emerald-100 flex items-start"><span class="bg-emerald-900/80 text-emerald-200 px-2.5 py-0.5 rounded-md text-xs font-bold uppercase tracking-wider mr-3 shadow-sm border border-emerald-700/50 mt-0.5 whitespace-nowrap">2. kolo</span> <span class="opacity-90 whitespace-normal leading-relaxed">$2</span></div>');
                            } else if (lines.length > 1) {
                                // Pokud tam už jsou fyzicky nové řádky (např z CHAR(10) v Google Sheets)
                                let newDisplayCell = '';
                                lines.forEach((line, i) => {
                                    if (line.trim() !== '') {
                                         let koloText = i === 0 ? "1. kolo" : "2. kolo";
                                         let koloColor = i === 0 ? "blue" : "emerald";
                                         // Zbavíme se případného nadbytečného textu "1. kolo" v datech, protože si generujeme vlastní hezčí badge
                                         let cleanLine = line.replace(/(1\.\s*kolo|2\.\s*kolo|1\.kolo|2\.kolo|1\s*kolo|2\s*kolo)[:\s-]*/gi, '').trim();
                                         if(cleanLine !== "") {
                                            newDisplayCell += `<div class="text-${koloColor}-100 mb-2 flex items-start"><span class="bg-${koloColor}-900/80 text-${koloColor}-200 px-2.5 py-0.5 rounded-md text-xs font-bold uppercase tracking-wider mr-3 shadow-sm border border-${koloColor}-700/50 mt-0.5 whitespace-nowrap">${koloText}</span> <span class="opacity-90 whitespace-normal leading-relaxed">${cleanLine}</span></div>`;
                                         }
                                    }
                                });
                                displayCell = newDisplayCell !== '' ? newDisplayCell : displayCell;
                            } else {
                                // Fallback, pokud tam není vůbec žádný nový řádek ani přímo napsáno "1. kolo"
                                displayCell = `<div class="text-slate-300 whitespace-normal leading-relaxed">${displayCell}</div>`;
                            }
                        }
                    } else {
                        // Podmíněné obarvování ostatních buněk tabulky (pokud to NENÍ sloupec s detaily penalizací)
                        if (typeof displayCell === 'string' && displayCell.includes('Čeká')) {
                            classNames += 'text-amber-500 ';
                        } else if (headerText.includes('st.') || headerText.includes('číslo') || headerText.includes('bib')) {
                            classNames += 'text-blue-400 font-bold text-center ';
                        } else if (index === sortIndex) {
                            classNames += 'text-emerald-400 font-bold text-2xl ';
                        }
                    }

                    tbodyHTML += `<td class="${classNames}">${displayCell}</td>`;
                });
                tbodyHTML += '</tr>';
            });

            if (tbodyHTML === '') {
                tbody.innerHTML = `<tr><td colspan="${headers.length + 1}" class="text-center py-20 text-xl text-gray-500">Zatím žádná data pro tuto kategorii...</td></tr>`;
            } else {
                tbody.innerHTML = tbodyHTML;
            }
        }

        // Start aplikace
        fetchResults();
        setInterval(fetchResults, FETCH_INTERVAL);
        if (isAutoPlay) startAutoPlayTimer();

    </script>
</body>
</html>
