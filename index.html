<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slalom Penalizace</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Slalom">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2563eb">

    <script>
        (function() {
            const currentUrl = window.location.href.split('?')[0].split('#')[0];
            const iconData = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%232563eb'/%3E%3Cpath d='M256 120 L370 380 L142 380 Z' fill='white'/%3E%3C/svg%3E";

            const manifest = {
                "name": "Slalom Penalizace",
                "short_name": "Slalom",
                "start_url": currentUrl,
                "display": "standalone",
                "background_color": "#f3f4f6",
                "theme_color": "#2563eb",
                "icons": [
                    {
                        "src": iconData,
                        "sizes": "192x192 512x512",
                        "type": "image/svg+xml",
                        "purpose": "any maskable"
                    }
                ]
            };

            const manifestString = JSON.stringify(manifest);
            const encodedManifest = "data:application/manifest+json;base64," + btoa(unescape(encodeURIComponent(manifestString)));
            
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = encodedManifest;
            document.head.appendChild(link);
        })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; overscroll-behavior-y: contain; }
        .btn { transition: all 0.2s; }
        .btn:active { transform: scale(0.95); }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; margin: 0; 
        }
    </style>
</head>
<body class="p-4 sm:p-6 text-gray-800">

    <!-- Toast Notifikace (Vyskakovací bublina) - Zvětšeno -->
    <div id="toast-notification" class="fixed top-4 left-4 right-4 sm:left-1/2 sm:w-96 sm:-ml-48 bg-gray-800 text-white text-xl font-bold px-6 py-5 rounded-2xl shadow-2xl z-50 transition-all duration-300 opacity-0 translate-y-[-100%] pointer-events-none flex items-center gap-4 border-l-8 border-green-500">
        <svg class="w-10 h-10 text-green-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
        <span id="toast-message" class="leading-tight"></span>
    </div>

    <div class="max-w-md mx-auto bg-white rounded-xl shadow-lg p-6">
        <h1 class="text-2xl font-bold text-center mb-6 text-blue-600">Slalom Penalizace</h1>

        <div id="setup-section" class="space-y-4">
            
            <div>
                <label class="block text-sm font-semibold mb-1">Stanoviště (1-6):</label>
                <select id="station-select" class="w-full p-2 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none text-lg">
                    <option value="" disabled selected>Vyberte stanoviště...</option>
                    <option value="1">Stanoviště 1</option>
                    <option value="2">Stanoviště 2</option>
                    <option value="3">Stanoviště 3</option>
                    <option value="4">Stanoviště 4</option>
                    <option value="5">Stanoviště 5</option>
                    <option value="6">Stanoviště 6</option>
                </select>
            </div>

            <div class="flex gap-4">
                <div class="flex-1">
                    <label class="block text-sm font-semibold mb-1">Od branky č.:</label>
                    <input type="number" id="gate-start" class="w-full p-2 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none text-lg text-center" min="1" max="18" value="1" onchange="checkSetupReady()">
                </div>
                <div class="flex-1">
                    <label class="block text-sm font-semibold mb-1">Do branky č.:</label>
                    <input type="number" id="gate-end" class="w-full p-2 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none text-lg text-center" min="1" max="18" value="3" onchange="checkSetupReady()">
                </div>
            </div>

            <button class="btn w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg mt-4 disabled:opacity-50" id="start-btn" onclick="initStation()" disabled>Pokračovat k zadávání</button>
        </div>

        <div id="penalty-section" class="hidden space-y-6">
            <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg border border-gray-200">
                <div>
                    <span class="text-sm text-gray-500">Stanoviště:</span>
                    <strong id="display-station" class="text-lg text-blue-600 ml-1"></strong>
                </div>
                <button onclick="resetSetup()" class="text-sm text-red-500 underline">Změnit nastavení</button>
            </div>

            <div class="flex bg-gray-100 rounded-lg p-1 gap-1">
                <button id="round-1-btn" class="flex-1 py-2 font-bold rounded text-white bg-blue-600 shadow transition-colors" onclick="setRound(1)">1. Kolo</button>
                <button id="round-2-btn" class="flex-1 py-2 font-bold rounded text-gray-500 hover:bg-gray-200 transition-colors" onclick="setRound(2)">2. Kolo</button>
            </div>

            <div>
                <label for="bib-number" class="block text-sm font-semibold mb-1 text-center">Startovní číslo:</label>
                <input type="number" id="bib-number" class="w-full text-center text-4xl p-3 border-2 border-gray-300 rounded-xl focus:border-blue-500 focus:outline-none font-bold" placeholder="000" inputmode="numeric">
            </div>

            <div id="gates-container" class="space-y-3">
                <p class="text-center text-gray-500 text-sm">Načítám branky...</p>
            </div>

            <button id="submit-btn" class="btn w-full flex items-center justify-center gap-2 py-4 bg-green-600 hover:bg-green-700 text-white text-xl font-bold rounded-xl shadow-md" onclick="submitData()">
                <span id="submit-text">Odeslat data</span>
                <div id="submit-spinner" class="spinner hidden"></div>
            </button>
            
            <div id="status-message" class="text-center text-sm font-semibold hidden"></div>
        </div>
    </div>

    <script>
        // --- ZDE VLOŽTE SVOJI ADRESU Z GOOGLE APPS SCRIPTU ---
        const GOOGLE_SCRIPT_URL = 'VLOZTE_URL_VASEHO_APPS_SCRIPTU'; 
        
        let currentStation = null;
        let currentGateStart = null;
        let currentGateEnd = null;
        let currentRound = 1;
        let toastTimeout;

        document.addEventListener('DOMContentLoaded', () => {
            const stationSelect = document.getElementById('station-select');
            stationSelect.addEventListener('change', checkSetupReady);
        });

        function checkSetupReady() {
            const station = document.getElementById('station-select').value;
            const startBtn = document.getElementById('start-btn');
            const gateStart = parseInt(document.getElementById('gate-start').value);
            const gateEnd = parseInt(document.getElementById('gate-end').value);
            
            if (station && gateStart >= 1 && gateEnd >= gateStart && gateEnd <= 18) {
                startBtn.disabled = false;
            } else {
                startBtn.disabled = true;
            }
        }

        function initStation() {
            currentStation = parseInt(document.getElementById('station-select').value);
            currentGateStart = parseInt(document.getElementById('gate-start').value);
            currentGateEnd = parseInt(document.getElementById('gate-end').value);
            
            document.getElementById('setup-section').classList.add('hidden');
            document.getElementById('penalty-section').classList.remove('hidden');
            
            document.getElementById('display-station').textContent = currentStation;
            
            renderGates();
        }

        function resetSetup() {
            document.getElementById('setup-section').classList.remove('hidden');
            document.getElementById('penalty-section').classList.add('hidden');
            
            document.getElementById('bib-number').value = '';
            setRound(1);
            hideStatus();
        }

        function setRound(roundNum) {
            currentRound = roundNum;
            const r1Btn = document.getElementById('round-1-btn');
            const r2Btn = document.getElementById('round-2-btn');
            
            if (roundNum === 1) {
                r1Btn.className = 'flex-1 py-2 font-bold rounded text-white bg-blue-600 shadow transition-colors';
                r2Btn.className = 'flex-1 py-2 font-bold rounded text-gray-500 hover:bg-gray-200 transition-colors';
            } else {
                r2Btn.className = 'flex-1 py-2 font-bold rounded text-white bg-blue-600 shadow transition-colors';
                r1Btn.className = 'flex-1 py-2 font-bold rounded text-gray-500 hover:bg-gray-200 transition-colors';
            }
            document.getElementById('bib-number').focus();
        }

        function renderGates() {
            const container = document.getElementById('gates-container');
            container.innerHTML = '';
            
            if (currentGateStart === null || currentGateEnd === null || currentGateStart > currentGateEnd) {
                container.innerHTML = '<p class="text-center text-red-500">Chybně zadaný rozsah branek.</p>';
                return;
            }

            for (let gateNum = currentGateStart; gateNum <= currentGateEnd; gateNum++) {
                const gateHTML = `
                    <div class="flex items-center justify-between p-3 bg-white border border-gray-200 rounded-lg shadow-sm">
                        <div class="text-xl font-bold w-12 text-center text-gray-700">${gateNum}</div>
                        <div class="flex-1 ml-4 flex gap-2">
                            <button class="flex-1 py-3 text-lg font-bold border-2 border-gray-300 rounded-lg text-gray-600 hover:bg-gray-100 transition-colors" onclick="setPenalty(${gateNum}, 0)">0</button>
                            <button class="flex-1 py-3 text-lg font-bold border-2 border-gray-300 rounded-lg text-orange-600 hover:bg-orange-50 transition-colors" onclick="setPenalty(${gateNum}, 2)">2</button>
                            <button class="flex-1 py-3 text-lg font-bold border-2 border-gray-300 rounded-lg text-red-600 hover:bg-red-50 transition-colors" onclick="setPenalty(${gateNum}, 50)">50</button>
                        </div>
                        <input type="hidden" id="gate-input-${gateNum}" value="0">
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', gateHTML);
            }
        }

        function setPenalty(gateNum, value) {
            document.getElementById(`gate-input-${gateNum}`).value = value;
            
            const gateDiv = document.getElementById(`gate-input-${gateNum}`).parentElement;
            const buttons = gateDiv.querySelectorAll('button');
            
            buttons.forEach(btn => {
                btn.classList.remove('ring-4', 'ring-opacity-50', 'bg-opacity-20');
                if (btn.textContent == '0') btn.classList.remove('bg-gray-200', 'ring-gray-400');
                if (btn.textContent == '2') btn.classList.remove('bg-orange-100', 'ring-orange-400');
                if (btn.textContent == '50') btn.classList.remove('bg-red-100', 'ring-red-400');
            });

            let selectedBtn;
            if (value === 0) selectedBtn = buttons[0];
            else if (value === 2) selectedBtn = buttons[1];
            else if (value === 50) selectedBtn = buttons[2];

            if (selectedBtn) {
                if (value === 0) selectedBtn.classList.add('bg-gray-200', 'ring-4', 'ring-gray-400', 'ring-opacity-50');
                if (value === 2) selectedBtn.classList.add('bg-orange-100', 'ring-4', 'ring-orange-400', 'ring-opacity-50');
                if (value === 50) selectedBtn.classList.add('bg-red-100', 'ring-4', 'ring-red-400', 'ring-opacity-50');
            }
        }

        async function submitData() {
            const bibNumber = document.getElementById('bib-number').value.trim();
            if (!bibNumber) { showStatus('Zadejte startovní číslo!', 'error'); return; }

            let currentPenalties = {};
            for (let i = currentGateStart; i <= currentGateEnd; i++) {
                currentPenalties[i] = parseInt(document.getElementById(`gate-input-${i}`).value) || 0;
            }

            // Uložíme si data pro zobrazení v toastu
            const submittedBib = bibNumber;
            const submittedRound = currentRound;
            const submittedPenalties = {...currentPenalties};

            const dataPayload = { 
                action: 'savePenalty', 
                kolo: currentRound, 
                stanoviste: currentStation, 
                startovniCislo: parseInt(bibNumber), 
                penalizace: currentPenalties 
            };

            setLoadingState(true);
            try {
                if(GOOGLE_SCRIPT_URL === 'https://script.google.com/macros/s/AKfycbyC3bmwnFnS4B5Scgyn88BuUYL40BJSERcNBNdml44hGP9MSijgB7qwGFmtZPS2HKszQ/exec') 
                {
                    setTimeout(() => { handleSuccess(submittedBib, submittedRound, submittedPenalties); }, 1000); return;
                }
                const response = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(dataPayload) });
                handleSuccess(submittedBib, submittedRound, submittedPenalties);
            } catch (error) {
                showStatus('Chyba připojení. Zkuste to znovu.', 'error');
            } finally {
                setLoadingState(false);
            }
        }

        function handleSuccess(bib, round, penalties) {
            // Zobrazení toast zprávy
            showToast(bib, round, penalties);
            
            document.getElementById('bib-number').value = '';
            for (let i = currentGateStart; i <= currentGateEnd; i++) {
                setPenalty(i, 0); 
            }
            
            document.getElementById('bib-number').focus();
            hideStatus();
        }

        // --- FUNKCE PRO TOAST NOTIFIKACI ---
        function showToast(bib, round, penalties) {
            const toast = document.getElementById('toast-notification');
            const toastMsg = document.getElementById('toast-message');
            
            let penaltyDetails = [];
            // Vypíše jen čisté hodnoty v pořadí branek na stanovišti (0, 50, 0)
            for (let i = currentGateStart; i <= currentGateEnd; i++) {
                penaltyDetails.push(penalties[i]);
            }
            
            let msg = `${round}.K - St.č. ${bib} uloženo. (${penaltyDetails.join(', ')})`;

            toastMsg.textContent = msg;
            
            toast.classList.remove('opacity-0', 'translate-y-[-100%]', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            if (toastTimeout) clearTimeout(toastTimeout);
            
            // Zmizí po 15 sekundách
            toastTimeout = setTimeout(hideToast, 15000);
            
            // Zmizí okamžitě po kliknutí/dotyku kdekoliv na obrazovce
            document.addEventListener('touchstart', hideToastOnTouch, {once: true});
            document.addEventListener('mousedown', hideToastOnTouch, {once: true});
        }

        function hideToastOnTouch() {
            hideToast();
        }

        function hideToast() {
            const toast = document.getElementById('toast-notification');
            toast.classList.remove('opacity-100', 'translate-y-0');
            toast.classList.add('opacity-0', 'translate-y-[-100%]', 'pointer-events-none');
            document.removeEventListener('touchstart', hideToastOnTouch);
            document.removeEventListener('mousedown', hideToastOnTouch);
        }
        // -----------------------------------

        function setLoadingState(isLoading) {
            const btn = document.getElementById('submit-btn');
            const text = document.getElementById('submit-text');
            const spinner = document.getElementById('submit-spinner');
            if (isLoading) {
                btn.disabled = true; btn.classList.add('opacity-75', 'cursor-not-allowed');
                text.textContent = 'Odesílám...'; spinner.classList.remove('hidden');
            } else {
                btn.disabled = false; btn.classList.remove('opacity-75', 'cursor-not-allowed');
                text.textContent = 'Odeslat data'; spinner.classList.add('hidden');
            }
        }

        function showStatus(message, type) {
            const statusEl = document.getElementById('status-message');
            statusEl.textContent = message;
            statusEl.classList.remove('hidden', 'text-green-600', 'text-red-600');
            if (type === 'success') { statusEl.classList.add('text-green-600'); } else { statusEl.classList.add('text-red-600'); }
        }
        function hideStatus() { document.getElementById('status-message').classList.add('hidden'); }
    </script>
</body>
</html>
