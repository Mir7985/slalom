<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slalom - Penalizace</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Slalom">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#3b82f6">

    <script>
        (function() {
            const currentUrl = window.location.href.split('?')[0].split('#')[0];
            const iconData = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='100' fill='%233b82f6'/%3E%3Ctext x='256' y='360' font-family='Arial' font-size='300' font-weight='bold' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E";

            const manifest = {
                "name": "Slalom - penalizace",
                "short_name": "penalizace",
                "start_url": currentUrl,
                "display": "standalone",
                "background_color": "#f3f4f6",
                "theme_color": "#3b82f6",
                "icons": [
                    {
                        "src": iconData,
                        "sizes": "192x192 512x512",
                        "type": "image/svg+xml",
                        "purpose": "any maskable"
                    }
                ]
            };

            const manifestString = JSON.stringify(manifest);
            const encodedManifest = "data:application/manifest+json;base64," + btoa(unescape(encodeURIComponent(manifestString)));
            
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = encodedManifest;
            document.head.appendChild(link);
        })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; overscroll-behavior-y: contain; }
        .btn { transition: all 0.2s; }
        .btn:active { transform: scale(0.95); }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* Tlačítka nebudou mít klasický dotykový "highlight" na telefonech */
        .penalty-btn { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="p-4 sm:p-6 text-gray-800">

    <!-- Toast Notifikace -->
    <div id="toast-notification" class="fixed top-4 left-4 right-4 sm:left-1/2 sm:w-96 sm:-ml-48 bg-gray-800 text-white text-xl font-bold px-6 py-5 rounded-2xl shadow-2xl z-50 transition-all duration-300 opacity-0 translate-y-[-100%] pointer-events-none flex items-center gap-4 border-l-8 border-blue-400">
        <svg class="w-10 h-10 text-blue-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
        <span id="toast-message" class="leading-tight"></span>
    </div>

    <div class="max-w-md mx-auto bg-white rounded-xl shadow-lg p-6 border-t-8 border-blue-500">
        <h1 class="text-2xl font-bold text-center mb-6 text-blue-600">Slalom - Penalizace</h1>

        <!-- Nastavení Stanoviště -->
        <div id="setup-section" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1">Kolo (1 nebo 2):</label>
                <select id="kolo-select" class="w-full p-2 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none text-lg" onchange="checkSetupReady()">
                    <option value="" disabled selected>Vyberte kolo...</option>
                    <option value="1">1. Kolo</option>
                    <option value="2">2. Kolo</option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-semibold mb-1">Stanoviště (1-6):</label>
                <select id="station-select" class="w-full p-2 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none text-lg" onchange="checkSetupReady()">
                    <option value="" disabled selected>Vyberte stanoviště...</option>
                    <option value="1">Stanoviště 1</option>
                    <option value="2">Stanoviště 2</option>
                    <option value="3">Stanoviště 3</option>
                    <option value="4">Stanoviště 4</option>
                    <option value="5">Stanoviště 5</option>
                    <option value="6">Stanoviště 6</option>
                </select>
            </div>

            <div class="flex gap-4">
                <div class="flex-1">
                    <label class="block text-sm font-semibold mb-1">Od branky č.:</label>
                    <input type="number" id="gate-start" class="w-full p-2 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none text-lg text-center" min="1" max="18" value="1" onchange="checkSetupReady()">
                </div>
                <div class="flex-1">
                    <label class="block text-sm font-semibold mb-1">Do branky č.:</label>
                    <input type="number" id="gate-end" class="w-full p-2 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none text-lg text-center" min="1" max="18" value="3" onchange="checkSetupReady()">
                </div>
            </div>

            <button class="btn w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg mt-4 disabled:opacity-50" id="start-btn" onclick="initStation()" disabled>Pokračovat k zadávání</button>
        </div>

        <!-- Rozhraní pro rozhodčí -->
        <div id="penalty-section" class="hidden space-y-6">
            <div class="flex justify-between items-center bg-blue-50 p-3 rounded-lg border border-blue-100 shadow-sm">
                <div class="flex items-center bg-gray-200/80 p-1 rounded-lg">
                    <button id="btn-kolo-1" onclick="changeKoloOnFly(1)" class="px-3 py-1.5 rounded-md text-sm font-bold transition-all bg-white text-blue-700 shadow-sm">1. kolo</button>
                    <button id="btn-kolo-2" onclick="changeKoloOnFly(2)" class="px-3 py-1.5 rounded-md text-sm font-bold transition-all text-gray-500">2. kolo</button>
                </div>
                <div class="flex items-center gap-1">
                    <span class="text-sm text-gray-500">Stanov.:</span>
                    <strong id="display-station" class="text-xl text-blue-700"></strong>
                </div>
                <button onclick="resetSetup()" class="text-sm px-3 py-2 bg-white border border-gray-300 rounded-lg text-gray-700 font-semibold shadow-sm active:bg-gray-100">Změnit</button>
            </div>

            <div>
                <label for="bib-number" class="block text-sm font-semibold mb-1 text-center">Startovní číslo :</label>
                <input type="number" id="bib-number" class="w-full text-center text-4xl p-3 border-2 border-gray-300 rounded-xl focus:border-blue-500 focus:outline-none font-bold" placeholder="000" inputmode="numeric">
            </div>

            <div id="gates-container" class="space-y-4 mt-4">
                <p class="text-center text-gray-500 text-sm">Načítám branky...</p>
            </div>

            <button id="submit-btn" class="btn w-full flex items-center justify-center gap-2 py-4 mt-6 bg-gray-800 hover:bg-black text-white text-xl font-bold rounded-xl shadow-md" onclick="submitData()">
                <span id="submit-text">Odeslat data</span>
                <div id="submit-spinner" class="spinner hidden"></div>
            </button>
            
            <div id="status-message" class="text-center text-sm font-semibold hidden"></div>
        </div>
    </div>

    <script>
        // --- ZDE VLOŽTE SVOJI ADRESU Z GOOGLE APPS SCRIPTU ---
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxqNRHFyYUzfD_aFrj4eJx7eFCXpNRhONdTw9Zl_Z0olHhxZ58RbX9FpvA_ryvqpDIN4w/exec'; 
        
        let currentKolo = null;
        let currentStation = null;
        let currentGateStart = null;
        let currentGateEnd = null;
        let currentPenalties = {};
        let toastTimeout;

        function checkSetupReady() {
            const kolo = document.getElementById('kolo-select').value;
            const station = document.getElementById('station-select').value;
            const startBtn = document.getElementById('start-btn');
            const gateStart = parseInt(document.getElementById('gate-start').value);
            const gateEnd = parseInt(document.getElementById('gate-end').value);
            
            if (kolo && station && gateStart >= 1 && gateEnd >= gateStart && gateEnd <= 18) {
                startBtn.disabled = false;
            } else {
                startBtn.disabled = true;
            }
        }

        function initStation() {
            currentKolo = parseInt(document.getElementById('kolo-select').value);
            currentStation = parseInt(document.getElementById('station-select').value);
            currentGateStart = parseInt(document.getElementById('gate-start').value);
            currentGateEnd = parseInt(document.getElementById('gate-end').value);
            
            document.getElementById('setup-section').classList.add('hidden');
            document.getElementById('penalty-section').classList.remove('hidden');
            
            updateKoloUI(currentKolo);
            document.getElementById('display-station').textContent = currentStation;
            
            renderGates();
        }

        function changeKoloOnFly(newKolo) {
            currentKolo = parseInt(newKolo);
            document.getElementById('kolo-select').value = currentKolo; // Synchronizuje to aj s hlavným menu
            updateKoloUI(currentKolo);
        }

        function updateKoloUI(kolo) {
            const btn1 = document.getElementById('btn-kolo-1');
            const btn2 = document.getElementById('btn-kolo-2');
            
            const activeClasses = ['bg-white', 'text-blue-700', 'shadow-sm'];
            const inactiveClasses = ['text-gray-500'];
            
            if (kolo === 1) {
                btn1.classList.add(...activeClasses);
                btn1.classList.remove(...inactiveClasses);
                btn2.classList.add(...inactiveClasses);
                btn2.classList.remove(...activeClasses);
            } else {
                btn2.classList.add(...activeClasses);
                btn2.classList.remove(...inactiveClasses);
                btn1.classList.add(...inactiveClasses);
                btn1.classList.remove(...activeClasses);
            }
        }

        function resetSetup() {
            document.getElementById('setup-section').classList.remove('hidden');
            document.getElementById('penalty-section').classList.add('hidden');
            document.getElementById('bib-number').value = '';
            hideStatus();
        }

        function renderGates() {
            const container = document.getElementById('gates-container');
            container.innerHTML = '';
            
            if (currentGateStart === null || currentGateEnd === null || currentGateStart > currentGateEnd) {
                container.innerHTML = '<p class="text-center text-red-500">Chybně zadaný rozsah branek.</p>';
                return;
            }

            for (let gateNum = currentGateStart; gateNum <= currentGateEnd; gateNum++) {
                currentPenalties[gateNum] = 0; // Výchozí stav v logice
                
                const gateHTML = `
                    <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-3">
                        <div class="text-sm font-bold text-gray-500 mb-2 uppercase text-center tracking-wider">Branka ${gateNum}</div>
                        <div class="flex items-center justify-between gap-3">
                            <button id="btn-${gateNum}-0" class="penalty-btn flex-1 py-4 rounded-xl font-bold text-2xl transition-all shadow-sm bg-gray-100 text-gray-500 border-2 border-gray-200" onclick="setPenalty(${gateNum}, 0)">0</button>
                            <button id="btn-${gateNum}-5" class="penalty-btn flex-1 py-4 rounded-xl font-bold text-2xl transition-all shadow-sm bg-gray-100 text-gray-500 border-2 border-gray-200" onclick="setPenalty(${gateNum}, 5)">5</button>
                            <button id="btn-${gateNum}-50" class="penalty-btn flex-1 py-4 rounded-xl font-bold text-2xl transition-all shadow-sm bg-gray-100 text-gray-500 border-2 border-gray-200" onclick="setPenalty(${gateNum}, 50)">50</button>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', gateHTML);
                
                // Vizuální přednastavení na nulu
                setPenalty(gateNum, 0);
            }
        }

        function setPenalty(gateNum, val) {
            currentPenalties[gateNum] = val;
            
            // Základní nevýrazný styl pro všechna tlačítka dané branky
            const classUnselected = "penalty-btn flex-1 py-4 rounded-xl font-bold text-2xl transition-all shadow-sm bg-gray-50 text-gray-400 border-2 border-gray-200 hover:bg-gray-100";
            
            [0, 5, 50].forEach(opt => {
                const btn = document.getElementById(`btn-${gateNum}-${opt}`);
                if (btn) btn.className = classUnselected;
            });
            
            // Extrémně výrazný styl pro vybrané tlačítko
            const selectedBtn = document.getElementById(`btn-${gateNum}-${val}`);
            if (val === 0) {
                selectedBtn.className = "penalty-btn flex-1 py-4 rounded-xl font-bold text-2xl transition-all shadow-lg bg-emerald-500 text-white border-2 border-emerald-600 transform scale-[1.05]";
            } else if (val === 5) {
                selectedBtn.className = "penalty-btn flex-1 py-4 rounded-xl font-bold text-2xl transition-all shadow-lg bg-amber-500 text-white border-2 border-amber-600 transform scale-[1.05]";
            } else if (val === 50) {
                selectedBtn.className = "penalty-btn flex-1 py-4 rounded-xl font-bold text-2xl transition-all shadow-lg bg-red-500 text-white border-2 border-red-600 transform scale-[1.05]";
            }
        }

        async function submitData() {
            const bibNumber = document.getElementById('bib-number').value.trim();
            if (!bibNumber) { showStatus('Zadejte startovní číslo!', 'error'); return; }

            const submittedBib = bibNumber;
            const submittedPenalties = {...currentPenalties};

            const dataPayload = { 
                action: 'savePenalty', 
                kolo: currentKolo, 
                stanoviste: currentStation, 
                startovniCislo: parseInt(bibNumber), 
                penalizace: submittedPenalties 
            };

            setLoadingState(true);
            try {
                if(GOOGLE_SCRIPT_URL === 'VLOZTE_URL_VASEHO_APPS_SCRIPTU') {
                    setTimeout(() => { handleSuccess(submittedBib, submittedPenalties); }, 1000); return;
                }
                const response = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(dataPayload) });
                handleSuccess(submittedBib, submittedPenalties);
            } catch (error) {
                showStatus('Chyba připojení. Zkuste to znovu.', 'error');
            } finally {
                setLoadingState(false);
            }
        }

        function handleSuccess(bib, penalties) {
            showToast(bib, penalties);
            
            // Vymazání čísla a vrácení VŠECH tlačítek zpět na nulu pro dalšího závodníka
            document.getElementById('bib-number').value = '';
            for (let i = currentGateStart; i <= currentGateEnd; i++) {
                setPenalty(i, 0); 
            }
            
            document.getElementById('bib-number').focus();
            hideStatus();
        }

        // --- FUNKCE PRO TOAST NOTIFIKACI ---
        function showToast(bib, penalties) {
            const toast = document.getElementById('toast-notification');
            const toastMsg = document.getElementById('toast-message');
            
            let penaltyDetails = [];
            for (let i = currentGateStart; i <= currentGateEnd; i++) {
                penaltyDetails.push(penalties[i]);
            }
            
            let msg = `St.č. ${bib} "  " (${penaltyDetails.join( ' , ' )})`;

            toastMsg.textContent = msg;
            
            toast.classList.remove('opacity-0', 'translate-y-[-100%]', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            if (toastTimeout) clearTimeout(toastTimeout);
            
            // Zmizí po 15 sekundách
            toastTimeout = setTimeout(hideToast, 15000);
            
            document.addEventListener('touchstart', hideToastOnTouch, {once: true});
            document.addEventListener('mousedown', hideToastOnTouch, {once: true});
        }

        function hideToastOnTouch() {
            hideToast();
        }

        function hideToast() {
            const toast = document.getElementById('toast-notification');
            toast.classList.remove('opacity-100', 'translate-y-0');
            toast.classList.add('opacity-0', 'translate-y-[-100%]', 'pointer-events-none');
            document.removeEventListener('touchstart', hideToastOnTouch);
            document.removeEventListener('mousedown', hideToastOnTouch);
        }

        function setLoadingState(isLoading) {
            const btn = document.getElementById('submit-btn');
            const text = document.getElementById('submit-text');
            const spinner = document.getElementById('submit-spinner');
            if (isLoading) {
                btn.disabled = true; btn.classList.add('opacity-75', 'cursor-not-allowed');
                text.textContent = 'Odesílám...'; spinner.classList.remove('hidden');
            } else {
                btn.disabled = false; btn.classList.remove('opacity-75', 'cursor-not-allowed');
                text.textContent = 'Odeslat data'; spinner.classList.add('hidden');
            }
        }

        function showStatus(message, type) {
            const statusEl = document.getElementById('status-message');
            statusEl.textContent = message;
            statusEl.classList.remove('hidden', 'text-blue-600', 'text-red-600');
            if (type === 'success') { statusEl.classList.add('text-blue-600'); } else { statusEl.classList.add('text-red-600'); }
        }
        function hideStatus() { document.getElementById('status-message').classList.add('hidden'); }
    </script>
</body>
</html>
