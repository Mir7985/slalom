<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <!-- Zamezení nechtěného přibližování a posouvání na mobilu -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ruční Časomíra</title>
  <style>
    body { font-family: sans-serif; padding: 15px; max-width: 450px; margin: 0 auto; background-color: #f9f9f9; }
    h2 { text-align: center; color: #333; margin-bottom: 15px; font-size: 22px; }
    
    /* --- STOPKY CSS --- */
    .stopwatch-card { background: #fff; padding: 20px; border-radius: 10px; border: 2px solid #ddd; margin-bottom: 20px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    /* Zvýraznění běžícího času */
    .stopwatch-display { font-size: 48px; font-family: 'Courier New', Courier, monospace; font-weight: 900; color: #000; margin-bottom: 5px; font-variant-numeric: tabular-nums; letter-spacing: -1px; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
    
    /* --- FORMULÁŘ CSS --- */
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
    input[type="number"], input[type="text"] { width: 100%; padding: 15px; font-size: 24px; text-align: center; box-sizing: border-box; border: 2px solid #ddd; border-radius: 8px; transition: border-color 0.2s; }
    input:focus { border-color: #007bff; outline: none; }
    
    .type-selector { display: flex; gap: 12px; margin-bottom: 20px; }
    .type-option { flex: 1; text-align: center; }
    .type-option input { display: none; }
    .type-option label {
      display: block; padding: 12px; background-color: #fff; border: 2px solid #ddd;
      border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: all 0.2s;
    }
    #typ_start:checked + label { background-color: #007bff; color: white; border-color: #0056b3; }
    #typ_cil:checked + label { background-color: #dc3545; color: white; border-color: #bd2130; }

    /* Hlavní odesílací tlačítko stopek */
    .btn-capture { width: 100%; padding: 22px; font-size: 22px; font-weight: bold; cursor: pointer; border-radius: 8px; border: none; background-color: #28a745; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.15); transition: transform 0.1s; margin-bottom: 20px; }
    .btn-capture:active { transform: scale(0.96); background-color: #218838; }
    
    #status { margin-bottom: 15px; padding: 15px; text-align: center; font-weight: bold; border-radius: 8px; display: none; font-size: 16px; }
    .loading { background-color: #e9ecef; color: #495057; }
    .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

    /* Manuální zadání (schované) */
    details { background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 20px; }
    summary { font-weight: bold; color: #555; cursor: pointer; font-size: 16px; }
    .manual-entry { margin-top: 15px; }
    .btn-manual { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 8px; border: none; background-color: #17a2b8; color: white; margin-top: 10px; }
    
    /* Historie odeslaných časů */
    .history-box { background: #fff; padding: 12px; border-radius: 8px; border: 2px solid #ddd; margin-bottom: 20px; }
    .history-title { font-size: 13px; color: #777; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; }
    #history-list { list-style: none; padding: 0; margin: 0; max-height: 120px; overflow-y: auto; }
    #history-list li { padding: 8px 0; border-bottom: 1px solid #eee; font-family: 'Courier New', Courier, monospace; font-size: 16px; color: #111; font-weight: bold; display: flex; justify-content: space-between; align-items: center;}
    #history-list li:last-child { border-bottom: none; }
    .hist-start { color: #007bff; width: 60px; }
    .hist-cil { color: #dc3545; width: 60px; }
    .hist-cislo { width: 60px; color: #555; }
    /* Mírné zvětšení a ztučnění času v historii */
    .hist-cas { color: #000; text-align: right; font-size: 19px; font-weight: 900; }
    
    /* Offline Fronta */
    #queue-status { background-color: #fff3cd; color: #856404; padding: 12px; border-radius: 8px; border: 1px solid #ffeeba; text-align: center; font-weight: bold; margin-bottom: 20px; display: none; }
    .queue-pending { display: block !important; }
  </style>
</head>
<body>

  <h2>Ruční Časomíra</h2>

  <!-- Integrované Stopky -->
  <div class="stopwatch-card">
    <div style="font-size: 14px; color: #777; margin-bottom: 5px; text-transform: uppercase;">Aktuální denní čas</div>
    <div class="stopwatch-display" id="display">00:00:00,00</div>
  </div>
  
  <div class="form-group">
    <div class="type-selector">
      <div class="type-option">
        <input type="radio" id="typ_start" name="typ_mereni" value="START">
        <label for="typ_start">START</label>
      </div>
      <div class="type-option">
        <input type="radio" id="typ_cil" name="typ_mereni" value="CÍL" checked>
        <label for="typ_cil">CÍL</label>
      </div>
    </div>
  </div>

  <div id="queue-status">⚠️ Offline režim. Čeká na odeslání: <span id="queue-count">0</span> záznamů</div>
  <div id="status"></div>

  <div class="form-group">
    <label for="st_cislo">Startovní číslo:</label>
    <input type="number" id="st_cislo" inputmode="numeric" placeholder="Např. 42">
  </div>

  <!-- Hlavní tlačítko, které bere čas ze stopek -->
  <button class="btn-capture" id="submitBtn" onclick="odeslatAktualniCas()">⏱ ZAZNAMENAT ČAS</button>

  <!-- Trvalý box pro odeslané časy -->
  <div class="history-box" id="historyBox">
    <div class="history-title">Poslední odeslané časy:</div>
    <ul id="history-list">
      <!-- Zde se budou přidávat časy -->
    </ul>
  </div>

  <!-- Původní ruční zadání ukryté v rozbalovacím menu -->
  <details>
    <summary>Zadat čas zpětně ručně (z papíru)</summary>
    <div class="manual-entry">
      <label for="cas_stopek">Čas (jen číslice):</label>
      <input type="text" id="cas_stopek" inputmode="numeric" placeholder="HHMMSSmm">
      <button class="btn-manual" onclick="odeslatRucniCas()">Uložit napsaný čas</button>
    </div>
  </details>

  <script>
    // Úprava na ES5 (starší JavaScript) pro maximální kompatibilitu se všemi telefony

    // --- NASTAVENÍ ODKAZU ---
    var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzxaL83eTowEBvAjtikldBW2As1sKeNiMa4rjwIdCzRuWTdR0Oklr0UrHkBYiODHVF0Sw/exec";
    
    // Proměnná pro odpočet schování hlášky
    var statusTimeout;

    // --- OFFLINE FRONTA LOGIKA ---
    var QUEUE_KEY = "casomira_queue";
    var isSyncing = false;

    function getQueue() {
      try { return JSON.parse(localStorage.getItem(QUEUE_KEY)) || []; } 
      catch (e) { return []; }
    }

    function saveQueue(q) {
      localStorage.setItem(QUEUE_KEY, JSON.stringify(q));
      updateQueueUI();
    }

    function updateQueueUI() {
      var q = getQueue();
      var queueBox = document.getElementById('queue-status');
      var queueCount = document.getElementById('queue-count');
      if (q.length > 0) {
        queueBox.className = 'queue-pending';
        if (queueCount) queueCount.innerText = q.length;
      } else {
        queueBox.className = '';
      }
    }

    function syncQueue() {
      if (isSyncing || !navigator.onLine) return;
      var q = getQueue();
      if (q.length === 0) return;

      isSyncing = true;
      var item = q[0];

      var queueBox = document.getElementById('queue-status');
      queueBox.innerHTML = "🔄 Odesílám data z paměti... zbývá: " + q.length;

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(item.payload)
      })
      .then(function() {
        q.shift(); // Smaže úspěšně odeslaný
        saveQueue(q);
        isSyncing = false;
        queueBox.innerHTML = '⚠️ Offline režim. Čeká na odeslání: <span id="queue-count">' + q.length + '</span> záznamů';
        syncQueue(); // Zkusí hned další záznam
      })
      .catch(function(error) {
        isSyncing = false;
        queueBox.innerHTML = '⚠️ Offline režim. Čeká na odeslání: <span id="queue-count">' + q.length + '</span> záznamů';
      });
    }

    // --- LOGIKA BĚŽÍCÍHO DENNÍHO ČASU ---
    function ziskejAktualniCas() {
      var now = new Date();
      var h = ("0" + now.getHours()).slice(-2);
      var m = ("0" + now.getMinutes()).slice(-2);
      var s = ("0" + now.getSeconds()).slice(-2);
      var ms = ("0" + Math.floor(now.getMilliseconds() / 10)).slice(-2);
      return h + ':' + m + ':' + s + ',' + ms;
    }

    // Neustálá aktualizace displeje
    window.onload = function() {
      updateQueueUI();
      syncQueue(); // Zkusí odeslat stará data ihned při spuštění aplikace
      window.addEventListener('online', syncQueue); // Zkusí odeslat, jakmile se mobil připojí k síti
      setInterval(syncQueue, 10000); // Pro jistotu kontroluje paměť každých 10 sekund

      setInterval(function() {
        var displayEl = document.getElementById('display');
        if (displayEl) {
          displayEl.innerText = ziskejAktualniCas();
        }
      }, 10);
    };

    // --- LOGIKA ODESÍLÁNÍ DAT ---

    // 1. Odeslání aktuálního denního času
    function odeslatAktualniCas() {
      var stCislo = document.getElementById('st_cislo').value;
      if(!stCislo) {
        alert('Nejprve zadejte startovní číslo!');
        document.getElementById('st_cislo').focus();
        return;
      }

      // Získáme přesný denní čas v momentě kliknutí
      var zachycenyCas = ziskejAktualniCas(); 
      var typMereni = document.querySelector('input[name="typ_mereni"]:checked').value;
      
      // Odešleme na server
      odeslatNaServer(stCislo, typMereni, zachycenyCas, "Denní čas z mobilu");
    }

    // 2. Odeslání z ručního textového pole (původní funkce)
    function odeslatRucniCas() {
      var stCislo = document.getElementById('st_cislo').value;
      var rawCas = document.getElementById('cas_stopek').value;
      var typMereni = document.querySelector('input[name="typ_mereni"]:checked').value;

      if(!stCislo || !rawCas) {
        alert('Vyplňte číslo i ruční čas!');
        return;
      }

      var dily = rawCas.split(/[:.,]/);
      var h = ("00" + (dily[0] || "")).slice(-2);
      var m = ("00" + (dily[1] || "")).slice(-2);
      var s = ("00" + (dily[2] || "")).slice(-2);
      // Setiny musí doplňovat nulu zprava (např. 5 -> 50), proto jednoduchá podmínka
      var msRaw = dily[3] || "00";
      var ms = (msRaw.length === 1) ? msRaw + "0" : ("00" + msRaw).slice(-2);
      
      var rucniCasZpracovany = h + ':' + m + ':' + s + ',' + ms;

      odeslatNaServer(stCislo, typMereni, rucniCasZpracovany, "Ručně přepsáno");
      document.getElementById('cas_stopek').value = ''; // Vyčištění
    }

    // --- JÁDRO PRO ODESLÁNÍ (Společné pro stopky i ruční zápis) ---
    function odeslatNaServer(stCislo, typMereni, formatovanyCas, zdrojZaznamu) {
      var statusDiv = document.getElementById('status');
      var btn = document.getElementById('submitBtn');

      // Vyrušíme předchozí odpočet, pokud měříme více dětí rychle za sebou
      clearTimeout(statusTimeout);

      var payload = {
        "st_cislo": stCislo,
        "kanal": typMereni,
        "cas_zaznamu": formatovanyCas,
        "raw_data": typMereni + " " + stCislo + " " + formatovanyCas + " (" + zdrojZaznamu + ")"
      };

      // Vždy zapíšeme okamžitě do vizuální historie (aby to rozhodčí hned viděl)
      var historyList = document.getElementById('history-list');
      var newItem = document.createElement('li');
      var typeClass = typMereni === 'START' ? 'hist-start' : 'hist-cil';
      newItem.innerHTML = '<span class="' + typeClass + '">' + typMereni + '</span> <span class="hist-cislo">#' + stCislo + '</span> <span class="hist-cas">' + formatovanyCas + '</span>';
      historyList.insertBefore(newItem, historyList.firstChild);

      // Okamžitě vyčistíme kolonku pro dalšího závodníka
      document.getElementById('st_cislo').value = '';
      document.getElementById('st_cislo').focus();

      // Pokud mobil ví, že nemá internet, uložíme rovnou do paměti a ani nezkoušíme odeslat
      if (!navigator.onLine) {
         var q = getQueue();
         q.push({ payload: payload });
         saveQueue(q);
         
         statusDiv.style.display = 'block';
         statusDiv.className = 'error';
         statusDiv.innerText = "Jste offline! Čas uložen do paměti.";
         statusTimeout = setTimeout(function() { statusDiv.style.display = 'none'; }, 2000);
         return;
      }

      btn.disabled = true;
      statusDiv.style.display = 'block';
      statusDiv.className = 'loading';
      statusDiv.innerText = "Odesílám čas " + formatovanyCas + "...";

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(function(response) {
        statusDiv.className = 'success';
        statusDiv.innerText = "Odesláno!";
        
        btn.disabled = false;
        
        // Hlášku o odesílání schováme rychle (2s)
        statusTimeout = setTimeout(function() { 
          statusDiv.style.display = 'none'; 
        }, 2000);
      })
      .catch(function(error) {
        // Pojistka: Pokud spojení spadne zrovna během letu požadavku
        var q = getQueue();
        q.push({ payload: payload });
        saveQueue(q);

        statusDiv.className = 'error';
        statusDiv.innerText = 'Výpadek sítě. Čas uložen do paměti.';
        btn.disabled = false;
        
        statusTimeout = setTimeout(function() { 
          statusDiv.style.display = 'none'; 
        }, 3000);
      });
    }

    // Maska pro doplňování znaků v ručním poli
    document.getElementById('cas_stopek').addEventListener('input', function (e) {
      var x = e.target.value.replace(/\D/g, '').match(/(\d{0,2})(\d{0,2})(\d{0,2})(\d{0,2})/);
      if (!x[2]) { e.target.value = x[1]; } 
      else if (!x[3]) { e.target.value = x[1] + ':' + x[2]; } 
      else if (!x[4]) { e.target.value = x[1] + ':' + x[2] + ':' + x[3]; } 
      else { e.target.value = x[1] + ':' + x[2] + ':' + x[3] + ',' + x[4]; }
    });
  </script>
</body>
</html>
